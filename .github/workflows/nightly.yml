name: Génération vidéos Agnes nocturne

permissions:
  contents: write

on:
  schedule:
    # Se déclenche tous les jours à 2h00 du matin (UTC)
    - cron: '0 2 * * *'
  workflow_dispatch: # Permet aussi de le lancer manuellement pour tester

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Sécurité : arrête le job après 6 heures max

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lancer le script de génération
        env:
          # C'est ici qu'on injecte le secret de manière sécurisée
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: node generate.js

      - name: Sauvegarder les modifications du storyboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storyboard.json
          git commit -m "🤖 Mise à jour automatique des vidéos générées"
          git push
