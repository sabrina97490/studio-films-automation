name: Génération vidéos Agnes nocturne

permissions:
  contents: write
  actions: write

on:
  schedule:
    # Heures creuses de la file gratuite d'Agnes (22h-1h et 6h-9h à Pékin),
    # soit 14h et 22h UTC = 15h et 23h à Paris (16h et minuit en été).
    - cron: '0 14,22 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lancer le script de génération
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node generate.js
