name: Génération vidéos Agnes nocturne

permissions:
  contents: write
  actions: write

on:
  schedule:
    # ⚠️ GitHub lit les horaires cron en heure UTC (jamais en heure de Paris).
    #    Agnes est à Singapour = UTC+8 (même heure que Pékin) : 14h UTC = 22h là-bas.
    # Bilan des journaux (19-24/11) : GitHub n'a déclenché que 8 des ~70 lancements horaires prévus
    # (il saute les horaires programmés quand il est chargé), et la file d'Agnes s'ouvre à des heures
    # imprévisibles. Désormais chaque session insiste 5 h puis se RELANCE ELLE-MÊME s'il reste des plans.
    # Ces horaires ne servent plus que de filet de sécurité (si la chaîne s'interrompt).
    - cron: '23 3,9,15,21 * * *'
  workflow_dispatch:

# Jamais deux générations en même temps : elles prendraient le même plan et
# dépenseraient deux fois le quota. Un lancement attend la fin du précédent.
concurrency:
  group: generation-videos
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lancer le script de génération
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Jeton fourni par GitHub (permission « actions: write » ci-dessus) pour relancer le workflow
          DISPATCH_TOKEN: ${{ github.token }}
        run: node generate.js
