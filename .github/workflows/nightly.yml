name: Génération vidéos Agnes nocturne

permissions:
  contents: write
  actions: write

on:
  schedule:
    # ⚠️ GitHub lit les horaires cron en heure UTC (jamais en heure de Paris).
    #    Agnes est à Singapour = UTC+8 (même heure que Pékin) : 14h UTC = 22h là-bas.
    # La file gratuite d'Agnes a été pleine même aux heures creuses d'Asie : au lieu de deviner,
    # on tente CHAQUE HEURE (à hh:17, moins chargé que hh:00 chez GitHub). Le journal de chaque
    # lancement affiche l'heure de Singapour et de Paris : après 2-3 jours, l'onglet Actions montre
    # les heures où la file accepte, et on resserrera les horaires sur celles-là.
    # Un lancement qui trouve la file pleine s'arrête seul après ~25 min. Dépôt public = minutes gratuites.
    - cron: '17 * * * *'
  workflow_dispatch:

# Jamais deux générations en même temps : elles prendraient le même plan et
# dépenseraient deux fois le quota. Un lancement attend la fin du précédent.
concurrency:
  group: generation-videos
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lancer le script de génération
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node generate.js
